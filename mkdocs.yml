site_name: Stellar-K8s Documentation
site_url: https://m1s0g1.github.io/Stellar-K8s/
site_description: Comprehensive documentation for deploying and managing Stellar blockchain nodes on Kubernetes
# Fail the build on any warning (missing nav targets, broken links, plugin
# issues) so docs regressions are caught in CI (#1691).
strict: true
repo_url: https://github.com/OtowoOrg/Stellar-K8s
repo_name: OtowoOrg/Stellar-K8s
edit_uri: edit/main/docs/

# The docs/ directory has a README.md that clashes with index.md. Excluding it
# here (instead of letting MkDocs warn) keeps `--strict` builds green. Setting
# exclude_docs replaces the MkDocs defaults, so those are repeated below.
exclude_docs: |
  .*
  /templates/
  /README.md

# Intentionally unpublished: these pages are empty placeholders.
not_in_nav: |
  /architecture/multi-cluster.md
  /operations/incident-response.md

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
      separator: '[\\s\\-,:!=\\[\\]()"/]+|(?!\\b)(?=[A-Z][a-z])|\\.(?!\\d)|&[lg]t;'
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true
  - git-revision-date-localized:
      # Creation dates are derived from `git log` order, which merge commits can
      # scramble (e.g. docs/operations/disaster-recovery.md). The plugin warns
      # about that, and warnings fail `mkdocs build --strict`, so only the
      # last-updated date is shown.
      enable_creation_date: false
      type: timeago

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html
  - tables
  - footnotes

