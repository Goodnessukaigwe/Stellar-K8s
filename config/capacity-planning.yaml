---
# Capacity planning configuration (issue #1835).
#
# `make capacity-plan` validates this file and summarises the forecast
# parameters; `make capacity-plan-check` only validates it.
#
# The values mirror the defaults documented in docs/capacity-planning.md and
# the CapacityRecommendationReport CRD in config/crd/.

defaults:
  horizonDays: 90
  confidenceLevel: 0.9
  minHistoryDays: 30
  lookbackDays: 365
  backtestStepDays: 7
  minLeadTimeDays: 14
  seasonalPeriodDays: 7
  seasonalMinImprovement: 0.1
  exhaustionThreshold: 1.0
  targetUtilization: 0.8
  mapeTargetPct: 15.0

dimensions:
  - Cpu
  - Memory
  - Storage
  - ObjectCount

# Operator resource requests by number of managed StellarNodes.
sizing:
  operatorResources:
    - maxNodes: 50
      cpu: 100m
      memory: 128Mi
    - maxNodes: 100
      cpu: 250m
      memory: 256Mi
    - maxNodes: 200
      cpu: 500m
      memory: 512Mi
    - maxNodes: 300
      cpu: 750m
      memory: 768Mi
    - maxNodes: 500
      cpu: 1000m
      memory: 1Gi

# Ledger growth used by the disk-sizing tables.
storageGrowth:
  testnet:
    initialGi: 100
    sixMonthGi: 280
    twelveMonthGi: 460
  mainnet:
    initialGi: 500
    sixMonthGi: 860
    twelveMonthGi: 1220
